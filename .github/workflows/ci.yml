name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build helper
        run: swift build -c release
        working-directory: helper
      - name: Desktop tests
        run: ./gradlew test --console=plain
        working-directory: desktop

  functions-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: firebase
      - run: npm ci
        working-directory: web
      - run: npm run build && npm test
        working-directory: functions
      - name: Firestore rules and emulator-backed function tests
        run: |
          npx firebase emulators:exec --only firestore --project demo-ontask "vitest run"
          npx firebase emulators:exec --only firestore --project demo-ontask "npm --prefix ../functions run test:emu"
        working-directory: firebase
      - run: npm test && npm run build
        working-directory: web
